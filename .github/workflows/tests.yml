name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Tutti i job girano anche se uno fallisce: senza questo, il
      # primo errore cancellava gli altri prima ancora di provare
      # (esattamente il pattern del run del rebranding).
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt include -r requirements.txt (PySide6):
          # i test GUI della 0.1.3 (test_scan_worker_pause.py) importano
          # Qt direttamente, quindi la CI deve avere la dipendenza.
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          # I test GUI (ScanWorker, QApplication) non hanno display sul
          # runner: Qt gira con il plugin offscreen.
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v
