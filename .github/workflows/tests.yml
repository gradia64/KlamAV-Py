name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Richiamato da release.yml: la stessa matrice prima di costruire i pacchetti.
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    # Immagine fissata: il passaggio a una nuova Ubuntu avviene con un
    # commit verificato, non quando GitHub sposta ubuntu-latest.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10: minimo dichiarato (pyproject, PKGBUILD). 3.14: l'ambiente
        # quotidiano (Debian sid, Arch) e quello dei crash QThread
        # riprodotti in test_qthread_retire.py.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install system libs for Qt offscreen
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Show versions
        run: |
          python --version
          python -c "import PySide6; print('PySide6', PySide6.__version__)" || echo "PySide6 non installato"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v
